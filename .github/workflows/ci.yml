name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure
        # LibObs is the production engine; CI still builds it (OBS is loaded at
        # runtime). Pass the flag explicitly so the switch stays intentional.
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 -DBEAN_ENABLE_LIBOBS=ON

      - name: Build
        run: cmake --build build-ci --config Debug --parallel

      - name: Test
        run: ctest --test-dir build-ci -C Debug --output-on-failure
